<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Run Routine</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

<div id="app">
  <h1>Run Routine</h1>

  <!-- 地域選択 -->
  <label for="areaSelect">地域を選択：</label>
  <select id="areaSelect">
    <option value="130000">千代田区（東京地方）</option>
    <option value="110000">朝霞（埼玉県南部）</option>
    <option value="080000">つくば（茨城県南部）</option>
    <option value="140000">鎌倉（神奈川県東部）</option>
    <option value="040000">仙台（宮城県）</option>
    <option value="130000">武蔵境（東京地方）</option>
  </select>

  <!-- 結果表示カード -->
  <div id="result" style="display:none;"></div>

  <!-- ボタン -->
  <button id="checkBtn">Next →</button>
</div>

<script src="main.js"></script>
<script>
  // Service Worker 登録
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
